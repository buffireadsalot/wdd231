<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation vs Transition Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 4rem;
      margin-top: 4rem;
    }

    .container {
      text-align: center;
    }

    /* --- Animation Loader --- */
    #loader {
      margin: 1rem auto;
      width: 50px;
      height: 50px;
      border: 5px solid transparent;
      border-color: #999 transparent #999 transparent;
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
      box-shadow: 0 0 1rem rgb(0 0 255 / 40%);
      position: relative;
    }

    #loader::after {
      content: '⚙️';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.25); }
    }

    /* --- Transition Loader --- */
    .loader-t {
      margin: 1rem auto;
      width: 50px;
      height: 50px;
      border: 5px solid #999;
      border-radius: 50%;
      position: relative;
      transition: transform 1.5s linear;
    }

    .loader-t::after {
      content: '⚙️';
      position: absolute;
      top: 50%;
      left: 50%;
      font-size: 2rem;
      transform: translate(-50%, -50%) scale(0); /* hidden initially */
      transition: transform 1.5s ease-in-out;
    }

    .loader-t:hover {
      transform: rotate(360deg); /* rotates once when hovered */
    }

    .loader-t:hover::after {
      transform: translate(-50%, -50%) scale(1.5); /* gear grows in */
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>CSS Animation (continuous)</h2>
    <div id="loader"></div>
  </div>

  <div class="container">
    <h2>CSS Transition (hover)</h2>
    <div class="loader-t"></div>
    <p>← Hover me!</p>
  </div>

</body>
</html>
