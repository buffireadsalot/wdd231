<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buffin Books • About</title>
<meta name="description" content="Buffin Books lets you search, save, and manage your personal library using the Open Library API.">
<meta name="author" content="Annela Buffin" />
<meta property="og:title" content="Buffin Books">
<meta property="og:description" content="Search, save, and manage your personal library.">
<meta property="og:type" content="website" />
<meta property="og:image" content="https://buffireadsalot.github.io/wdd231/final/images/buffin-books-logo.svg">
<meta property="og:url" content="https://buffireadsalot.github.io/wdd231/final/library.html" />
<link rel="icon" href="images/favicon.ico" />

<!-- Google Fonts -->
 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
   
<!--Styles-->
<link rel="stylesheet" href="styles/style.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="library.html">
    <img src="images/buffin-books-logo.svg" alt="Buffin Books Logo" class="logo">
    Buffin Books
  </a>
  <button id="menu-btn" class="menu-btn" aria-expanded="false" aria-controls="site-nav">☰<span class="sr-only">Menu</span></button>
  <nav id="site-nav" class="site-nav" aria-label="Primary">
  <a href="index.html">Find Books</a>
  <a href="library.html" class="current">My Library</a>  <!-- active -->
  <a href="books.html">Add a Book</a>
</nav>

</header>

<main class="container">
<section class="toolbar">
<h1>My Library</h1>

<p id="count" class="status"></p>
<div class="controls">
<label>Filter by author
<input id="filter-author" type="text" placeholder="e.g., Le Guin" />
</label>

<button id="clear-shelf" class="danger">Clear Shelf</button>
</div>
<!-- Toolbar (optional filter + clear button) -->
<div class="actions">
<label class="inline"><input id="filter-fav" type="checkbox"> Show favorites only</label>
</div>
</section>


<section aria-live="polite" aria-busy="false">
<h2 class="sr-only">Saved Books</h2>
<div id="shelf" class="cards grid"></div>
<p id="status" class="status" hidden></p>
</section>
</main>


<footer class="site-footer">
  <p>© <span id="year"></span> Buffin Books • <a href="attributions.html">Attributions</a></p>
<p><a href="#" id="demo-video">Demo Video</a></p>
</footer>


<div id="modal-root"></div>
<script type="module" src="scripts/main-library.js"></script>
</body>
</html>
