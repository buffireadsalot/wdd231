<meta property="og:title" content="Personal Library – Search" />

<meta property="og:type" content="website" />
<meta property="og:image" content="images/placeholder.svg" />

<!-- Google Fonts -->

<body>
<header class="site-header">
  <a class="brand" href="index.html">
    <img src="images/buffin-books-logo.svg" alt="Buffin Books Logo" class="logo" width="128" height="128">
    Buffin Books
  </a>
  <button id="menu-btn" class="menu-btn" aria-expanded="false" aria-controls="site-nav">☰<span class="sr-only">Menu</span></button>
 <nav id="site-nav" class="site-nav" aria-label="Primary">
  <a href="index.html" class="current">Search</a>        <!-- active -->
  <a href="library.html">My Library</a>
  <a href="books.html">Add Books</a>
</nav>

</header>

<main class="container">
<section class="hero">
<h1>Search Open Library</h1>
<p>Find books by title or author and add them to your shelf.</p>
<form id="search-form" class="search" role="search">
<label for="q" class="sr-only">Search for books</label>
<input id="q" name="q" type="search" placeholder="e.g., Pride and Prejudice or Jane Austen" required />
<button type="submit">Search</button>
</form>
<div class="actions">
<button id="toggle-view" data-view="grid" title="Toggle grid/list">Toggle View</button>
</div>
</section>


<section aria-live="polite" aria-busy="false">
<h2 class="sr-only">Search Results</h2>
<div id="results" class="cards grid"></div>
<p id="status" class="status" hidden></p>
</section>
</main>


<footer class="site-footer">
<p>© <span id="year"></span> Annela Buffin • <a href="about.html#attributions">Attributions</a></p>
<p><a href="#" id="demo-video">Demo Video</a></p>
</footer>


<!-- Modal root -->
<div id="modal-root"></div>
