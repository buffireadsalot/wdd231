<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buffin Books • Find A Book</title>
<meta name="description" content="Buffin Books lets you search, save, and manage your personal library using the Open Library API.">
<meta name="author" content="Annela Buffin" />
<meta property="og:title" content="Buffin Books">
<meta property="og:description" content="Search, save, and manage your personal library.">
<meta property="og:type" content="website" />
<meta property="og:image" content="https://buffireadsalot.github.io/wdd231/final/images/buffin-books-logo.svg">
<!-- Open Graph -->
<meta property="og:title" content="Personal Library – Search" />
<meta property="og:description" content="Find books and build your shelf with Open Library." />
<meta property="og:type" content="website" />
<meta property="og:image" content="images/buffin-books-logo.svg" />
<meta property="og:url" content="https://buffireadsalot.github.io/wdd231/final/" />
<link rel="icon" href="images/favicon.ico">

<!-- Google Fonts -->
 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
   
<!--Styles-->
<link rel="stylesheet" href="styles/style.css" />
</head>
<body>
<header class="site-header" data-nav>
  <a class="brand" href="index.html">
    <img class="logo" src="images/buffin-books-logo.svg" alt="Buffin Books">
    <span class="brand">Buffin Books</span>
  </a>

  <button class="hamburger" data-nav-toggle
          aria-expanded="false" aria-controls="site-nav"
          aria-label="Toggle navigation">☰</button>

  <nav id="site-nav" class="site-nav">
    <a href="index.html" class="current">Find Books</a>
    <a href="library.html">My Library</a>
    <a href="books.html">Add a Book</a>
  </nav>
</header>

<main class="container">
<section class="hero">
<h1>Search Open Library</h1>
<p>Find books by title, author, or genre and add them to your shelf.</p>
<form id="search-form" class="search" role="search">
<label for="q" class="sr-only">Search for books</label>
<input id="q" name="q" type="search" placeholder="e.g., Pride and Prejudice or Jane Austen" required />
<button type="submit">Search</button>
</form>
<div class="actions">
<button id="toggle-view" data-view="grid" title="Toggle grid/list">Toggle View</button>
</div>
</section>


<section aria-live="polite" aria-busy="false">
<h2 class="sr-only">Search Results</h2>
<div id="results" class="cards grid"></div>
<p id="status" class="status" hidden></p>
</section>

<section aria-live="polite">
  <div id="results" class="cards grid"></div>
  <button id="load-more" hidden>Load more</button>
</section>

</main>

 <script src="scripts/utils.js" defer></script>
 
<footer class="site-footer">
  <p>© <span id="year"></span> Buffin Books • <a href="attributions.html">Attributions</a></p>
<p><a href="#" id="demo-video">Demo Video</a></p>
</footer>


<!-- Modal root -->
<div id="modal-root"></div>


<script type="module" src="scripts/main-index.js"></script>
</body>
</html>
